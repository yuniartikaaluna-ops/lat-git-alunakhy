<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokoKelompok - Produk</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { background-color: #e0f2fe; color: #334155; display: flex; flex-direction: column; min-height: 100vh; }
        
        nav { background-color: #ffffff; padding: 18px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px dashed #bae6fd; }
        nav .logo { font-family: 'Fredoka', sans-serif; color: #0284c7; font-size: 26px; font-weight: 700; text-decoration: none; }
        nav ul { list-style: none; display: flex; gap: 20px; }
        nav ul li a { color: #64748b; text-decoration: none; font-size: 16px; font-weight: 700; padding: 8px 16px; border-radius: 20px; transition: all 0.2s; }
        nav ul li a:hover, nav ul li a.active { background-color: #f0f9ff; color: #0284c7; }

        main { flex: 1; width: 100%; padding: 40px 6%; max-width: 1200px; margin: 0 auto; }
        .section-title { font-family: 'Fredoka', sans-serif; font-size: 32px; color: #0369a1; text-align: center; margin-bottom: 35px; }
        
        /* GRID ETALASE */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
        .product-card { background: #ffffff; border-radius: 24px; border: 2px solid #bae6fd; overflow: hidden; box-shadow: 0 6px 0px rgba(2, 132, 199, 0.05); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        
        .product-image { width: 100%; height: 230px; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .product-info { padding: 20px; text-align: center; }
        .product-info h4 { font-family: 'Fredoka', sans-serif; font-size: 18px; margin-bottom: 8px; color: #334155; }
        .product-info .price { font-weight: 700; color: #0284c7; font-size: 16px; margin-bottom: 15px; background: #e0f2fe; display: inline-block; padding: 4px 12px; border-radius: 12px; }
        
        .buy-btn { display: block; width: 100%; background-color: #fbcfe8; color: #9d174d; padding: 10px; text-decoration: none; border-radius: 15px; font-weight: 700; text-align: center; border: 2px solid #f472b6; box-shadow: 0 3px 0px #f472b6; }
        .buy-btn:hover { background-color: #f472b6; color: white; }

        footer { background-color: #ffffff; text-align: center; padding: 25px 20px; border-top: 3px dashed #bae6fd; margin-top: auto; }
        footer p { font-size: 14px; color: #64748b; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">✨ TokoKelompok</a>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="produk.html" class="active">Produk</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <main>
        <h3 class="section-title">Katalog Produk</h3>
        <div class="product-grid">
            
            <div class="product-card">
                <div class="product-image">
                    <img src="sepatu.jpeg" alt="Sepatu Keren">
                </div>
                <div class="product-info">
                    <h4>Sepatu Keren</h4>
                    <p class="price">Rp 150.000</p>
                    <a href="#" class="buy-btn">Mau Beli Nyata 💕</a>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="tas.jpeg" alt="Tas Punggung">
                </div>
                <div class="product-info">
                    <h4>Tas Punggung</h4>
                    <p class="price">Rp 200.000</p>
                    <a href="#" class="buy-btn">Mau Beli Nyata 💕</a>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>2026 Website Tim Kelompok. Dibuat dengan cinta 🌸</p>
    </footer>

</body>
</html>
