<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokoKita - Kontak</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { background-color: #e0f2fe; color: #334155; display: flex; flex-direction: column; min-height: 100vh; }
        
        nav { background-color: #ffffff; padding: 18px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px dashed #bae6fd; }
        nav .logo { font-family: 'Fredoka', sans-serif; color: #0284c7; font-size: 26px; font-weight: 700; text-decoration: none; }
        nav ul { list-style: none; display: flex; gap: 20px; }
        nav ul li a { color: #64748b; text-decoration: none; font-size: 16px; font-weight: 700; padding: 8px 16px; border-radius: 20px; transition: all 0.2s; }
        nav ul li a:hover, nav ul li a.active { background-color: #f0f9ff; color: #0284c7; }

        main { flex: 1; width: 100%; padding: 40px 6%; max-width: 600px; margin: 40px auto; }
        
        /* DEKORASI KARTU KONTAK */
        .contact-box { background: #ffffff; border-radius: 24px; padding: 40px; border: 2px solid #bae6fd; box-shadow: 0 8px 0px rgba(2, 132, 199, 0.05); text-align: center; }
        .section-title { font-family: 'Fredoka', sans-serif; font-size: 32px; color: #0369a1; margin-bottom: 25px; }
        
        .contact-info { margin-top: 20px; }
        .contact-item { margin-bottom: 25px; font-size: 16px; background: #f0f9ff; padding: 15px; border-radius: 16px; border: 1px dashed #7dd3fc; }
        .contact-item strong { color: #0369a1; display: block; font-size: 18px; margin-bottom: 5px; }
        .contact-item p { color: #64748b; }

        footer { background-color: #ffffff; text-align: center; padding: 25px 20px; border-top: 3px dashed #bae6fd; margin-top: auto; }
        footer p { font-size: 14px; color: #64748b; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">✨ TokoKelompok</a>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="produk.html">Produk</a></li>
            <li><a href="kontak.html" class="active">Kontak</a></li>
        </ul>
    </nav>

    <main>
        <div class="contact-box">
            <h3 class="section-title">Hubungi Kami 💌</h3>
            <div class="contact-info">
                <div class="contact-item">
                    <strong>📧 Email Resmi:</strong> 
                    <p>yuniartikaaluna@gmail.com</p>
                </div>
                <div class="contact-item">
                    <strong>📍 Lokasi Tim:</strong>
                    <p>Gedung Ruang Komputer RPL, Lantai 2</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>2026 Website Tim Kelompok. Dibuat dengan cinta 🌸</p>
    </footer>

</body>
</html>
